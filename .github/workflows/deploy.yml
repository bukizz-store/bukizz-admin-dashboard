name: Deploy Admin Dashboard to VPS

on:
  push:
    branches:
      - main  # Make sure your default branch is 'main' (or change to 'master')

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy using SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          # 1. Navigate to the admin project folder
          cd ~/admin

          # 2. FORCE CLEANUP (Prevents merge conflicts)
          git reset --hard
          git clean -fd

          # 3. Pull the latest code from GitHub
          git pull origin main

          # 4. Install Dependencies
          npm install

          # 5. Build the Vite Project (compiles to 'dist' folder)
          npm run build

          # 6. Deploy to Nginx Public Folder
          # Clear the old files first, then copy the new build
          rm -rf /var/www/bukizz-admin/*
          cp -r dist/* /var/www/bukizz-admin/

          echo "Admin Dashboard Deployment Complete!"